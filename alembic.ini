# Alembic configuration. One migration head, owned by the store image: the
# `migrate` one-shot runs `alembic upgrade head` before the store starts, on
# compose and as a Job in Kubernetes. The database URL is not written here; it
# is assembled at run time from the COPPERMIND_ wiring so no credential ever
# appears in a file in this repository.
[alembic]
script_location = coppermind/db/migrations
prepend_sys_path = .
file_template = %%(rev)s_%%(slug)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stdout,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "coppermind-store"
version = "0.1.0.dev0"
description = "Coppermind store: the only writer of the notes filesystem"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "coppermind",
    "fastapi>=0.115",
    "icalendar>=6.3,<8",
    "ijson>=3.3",
    "pypdf>=5.1",
    "python-docx>=1.1",
    "python-pptx>=1.0",
    "recurring-ical-events>=3.8,<4",
    "uvicorn[standard]>=0.30",
]

[tool.uv.sources]
coppermind = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["coppermind_store"]

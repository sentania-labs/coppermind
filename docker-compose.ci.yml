# CI overlay. Used with the base file:
#
#   docker compose -f docker-compose.yml -f docker-compose.ci.yml up -d
#
# Images come from the tarballs the image job built and tested, so the smoke
# test exercises exactly what would be published, never a fresh build.
services:

  bootstrap:
    image: coppermind/store:ci
    build: !reset null

  migrate:
    image: coppermind/store:ci
    build: !reset null

  store:
    image: coppermind/store:ci
    build: !reset null

  api:
    image: coppermind/api:ci
    build: !reset null

  git:
    image: coppermind/git:ci
    build: !reset null

  editor:
    image: coppermind/store:ci
    build: !reset null

  obsidian-sync:
    image: coppermind/obsidian-sync:ci
    build: !reset null
    environment:
      COPPERMIND_SYNC_FAKE: "1"

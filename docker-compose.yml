# Coppermind quickstart and CI fixture.
#
#   docker compose up -d
#
# That is the whole setup. The bootstrap one-shot creates the volumes,
# generates the internal token, PostgreSQL password and default API key, and
# writes the control state files with their shipped defaults, so nothing has
# to be hand populated before the stack runs.
#
# Image tags here track `latest` on purpose: this file is the quickstart.
# Anything that deploys Coppermind for real pins a version or a digest in its
# own repository, never here.
name: coppermind

# Wiring the deployer may override from `.env`. Compose does not put `.env`
# into a container by itself, so anything an operator is told they can set has
# to be forwarded here or it silently does nothing.
x-wiring: &wiring
  COPPERMIND_LOG_LEVEL: ${COPPERMIND_LOG_LEVEL:-INFO}

x-store-image: &store-image
  image: ghcr.io/sentania-labs/coppermind/store:latest
  build:
    context: .
    dockerfile: services/store/Dockerfile

x-api-image: &api-image
  image: ghcr.io/sentania-labs/coppermind/api:latest
  build:
    context: .
    dockerfile: services/api/Dockerfile

x-admin-image: &admin-image
  image: ghcr.io/sentania-labs/coppermind/admin:latest
  build:
    context: .
    dockerfile: services/admin/Dockerfile

x-git-image: &git-image
  image: ghcr.io/sentania-labs/coppermind/git:latest
  build:
    context: .
    dockerfile: services/git/Dockerfile

x-obsidian-sync-image: &obsidian-sync-image
  image: ghcr.io/sentania-labs/coppermind/obsidian-sync:latest
  build:
    context: .
    dockerfile: services/obsidian-sync/Dockerfile

services:

  # Runs once per `up` and exits 0. Root only long enough to hand /data and
  # the credential volumes to uid 1000, which every Coppermind image runs as.
  # Idempotent: a second run keeps existing secrets and existing settings.
  bootstrap:
    <<: *store-image
    user: "0:0"
    command: ["python3", "-m", "coppermind_store.bootstrap"]
    environment: *wiring
    volumes:
      - data:/data
      - internal-token:/run/coppermind/internal
      - postgres-password:/run/coppermind/postgres
      - default-api-key:/run/coppermind/api
    restart: "no"

  # Bundled PostgreSQL. It holds mirrored and derived state only: every row
  # can be rebuilt from /data, which is why losing it is an outage and not a
  # data loss. The password is a file, never an environment value.
  #
  # Deliberately not behind a `bundled-db` profile. Compose reads `.env` and
  # not `.env.example`, so a profile would leave a clean checkout with no
  # database and an operator with a file to copy before anything runs, which
  # breaks the quickstart this file exists to be. The services already accept
  # an external PostgreSQL through COPPERMIND_DATABASE_URL; expressing that
  # choice in compose arrives with the deployment work.
  postgres:
    image: postgres:16@sha256:c1b3783309b6499c795eed7c20135a1a4d25cae1b575c3d52c6f536129a1b109
    restart: unless-stopped
    environment:
      POSTGRES_DB: coppermind
      POSTGRES_USER: coppermind
      POSTGRES_PASSWORD_FILE: /run/coppermind/postgres/postgres-password
    volumes:
      - pgdata:/var/lib/postgresql/data
      - postgres-password:/run/coppermind/postgres:ro
    depends_on:
      bootstrap:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U coppermind -d coppermind"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  # One-shot migrations, from the store image so the schema and the code that
  # depends on it are always the same build.
  migrate:
    <<: *store-image
    command: ["alembic", "-c", "/app/alembic.ini", "upgrade", "head"]
    environment: *wiring
    volumes:
      - postgres-password:/run/coppermind/postgres:ro
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  # The only writer of the notes filesystem. Exactly one replica, always.
  store:
    <<: *store-image
    restart: unless-stopped
    environment: *wiring
    volumes:
      - data:/data
      - internal-token:/run/coppermind/internal:ro
      - postgres-password:/run/coppermind/postgres:ro
    depends_on:
      migrate:
        condition: service_completed_successfully

  # The public contract. Stateless, mounts only its internal credential, and
  # calls the store.
  # Bound to loopback by default even though every public route now requires
  # a scoped API key. Exposure remains an explicit deployer choice.
  api:
    <<: *api-image
    restart: unless-stopped
    environment: *wiring
    volumes:
      - internal-token:/run/coppermind/internal:ro
    ports:
      - "${COPPERMIND_API_BIND:-127.0.0.1:8080}:8080"
    depends_on:
      store:
        condition: service_healthy

  # Operator pages have their own image, port and session boundary. Only the
  # control state subtree of the data volume is mounted, so the notes
  # filesystem is not reachable from Admin at all and the store stays its one
  # writer. The subtree exists by the time this starts: bootstrap creates it
  # before migrate, which this waits on.
  admin:
    <<: *admin-image
    restart: unless-stopped
    environment: *wiring
    volumes:
      - type: volume
        source: data
        target: /data/state
        volume:
          subpath: state
      - postgres-password:/run/coppermind/postgres:ro
    ports:
      - "${COPPERMIND_ADMIN_BIND:-127.0.0.1:8082}:8082"
    depends_on:
      migrate:
        condition: service_completed_successfully

  # Keeps the history of the notes filesystem in /data/notes/.git: polls, and
  # commits what has settled. It writes nothing but `.git` and its status file,
  # holds no credential, and has no network at all, so it cannot push anywhere.
  # It needs only the volume, not the store, and carries on while the store or
  # PostgreSQL is down.
  git:
    <<: *git-image
    restart: unless-stopped
    environment: *wiring
    network_mode: none
    volumes:
      - data:/data
    depends_on:
      bootstrap:
        condition: service_completed_successfully

  # A shell on the notes volume that is not the store. The smoke storyline
  # edits, moves and deletes notes the way a device does, and doing that
  # through the store would prove only that the store can change its own
  # volume. It runs nothing until a test execs into it, holds no credential
  # and has no network at all.
  #
  # Behind a profile so the quickstart above starts the real services only.
  # `ci/smoke.sh` names the profile itself, so both `make smoke` and running
  # the script directly bring it up.
  editor:
    <<: *store-image
    profiles: ["smoke"]
    entrypoint: ["sleep", "infinity"]
    user: "1000:1000"
    network_mode: none
    volumes:
      - data:/data
    depends_on:
      bootstrap:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python3", "-c", "pass"]
      interval: 5s
      timeout: 5s
      retries: 3

  # Supervises the Obsidian client and owns only its own state under
  # /data/state/sync. Its account token and vault encryption key belong on the
  # separate credential volume, outside the data backup. Real sync is refused
  # until the later Admin service can guide creation of Coppermind's own
  # encrypted remote vault and collect its credentials.
  # The simulated client used to prove the lifecycle lives in
  # docker-compose.sync-smoke.yml and is deliberately not settable here.
  obsidian-sync:
    <<: *obsidian-sync-image
    restart: unless-stopped
    environment: *wiring
    volumes:
      - data:/data
      - internal-token:/run/coppermind/internal:ro
      - obsidian-sync-credentials:/var/lib/obsidian-sync
    depends_on:
      bootstrap:
        condition: service_completed_successfully

volumes:
  # Everything a backup needs: the notes filesystem, source bundles and the
  # control state files. Back up `default-api-key` with it to keep the default
  # credential readable; without it a live default becomes unrecoverable and is
  # never re-minted, and a revoked one stays revoked either way.
  data:
  pgdata:
  internal-token:
  postgres-password:
  default-api-key:
  # Deliberately outside the data backup. Restoring data without this volume
  # requires a fresh Obsidian login through the future guided Admin setup.
  obsidian-sync-credentials:
